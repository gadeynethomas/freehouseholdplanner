name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-poc:
    name: Sync PoC (type check, lint, format, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: poc/sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: poc/sync/package-lock.json
      - run: npm ci
      - run: npm run check

  probe-core:
    name: Android probe core (cargo test, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: poc/android/probe-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            poc/android/probe-core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('poc/android/probe-core/Cargo.lock') }}
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  core:
    name: Core (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add clippy rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-core-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy -p fhp-core --locked --all-targets -- -D warnings
      - run: cargo test -p fhp-core --locked

  app:
    name: App (UI checks and build, Tauri shell clippy and tests)
    # Pinned: ubuntu-latest (26.04) could not reach the Ubuntu mirrors for hours on 2026-11-11.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the system libraries Tauri needs on Linux
        # Fail fast when the Ubuntu mirrors are unreachable instead of retrying until the job times out.
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - run: rustup component add clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-app-ubuntu-24.04-${{ hashFiles('Cargo.lock') }}
      - run: npm ci
        working-directory: app
      # Type check, lint, format check, tests and the build into app/dist, which the shell embeds.
      - run: npm run check
        working-directory: app
      - run: cargo clippy -p freehouseholdplanner --locked --all-targets -- -D warnings
      - run: cargo test -p freehouseholdplanner --locked
